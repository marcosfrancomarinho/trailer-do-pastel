name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trailer_do_pastel?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Instalar Yarn
        run: npm install --global yarn@1.22.22 --force

      - name: Instalar dependências
        run: yarn install --frozen-lockfile --non-interactive

      - name: Gerar Prisma Client
        run: yarn prisma generate

      - name: Executar testes
        run: yarn test

      - name: Verificar tipos e gerar build
        run: yarn build

