name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trailer_do_pastel?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Instalar Yarn
        run: npm install --global yarn@1.22.22 --force

      - name: Instalar dependências
        run: yarn install --frozen-lockfile --non-interactive

      - name: Gerar Prisma Client
        run: yarn prisma generate

      - name: Executar testes
        run: yarn test

      - name: Verificar tipos e gerar build
        run: yarn build

  database-tests:
    name: Integração e E2E (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: trailer_do_pastel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trailer_do_pastel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trailer_do_pastel_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trailer_do_pastel_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configurar Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Instalar Yarn
        run: npm install --global yarn@1.22.22 --force
      - name: Instalar dependências
        run: yarn install --frozen-lockfile --non-interactive
      - name: Gerar Prisma Client
        run: yarn prisma generate
      - name: Testes de integração com migrations reais
        run: yarn test:integration
      - name: Testes E2E do build de produção
        run: yarn test:e2e
